<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}</style>
<title>Газлайт 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: полноэкранная сцена, панель карточки справа (снизу на телефоне), шапка с кнопками сверху */
:root{--bg:#1b1410;--ink:#f3e9dc;--muted:#c8b8a6;--card:#2a201a;--line:#4a3a2e;--accent:#e0a458;--bad:#e4705a;--ok:#8fc78a;--disp:"Playfair Display",Georgia,serif;--body:"Inter Tight","Segoe UI",system-ui,sans-serif;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
#scene{position:fixed;inset:0}
canvas{display:block}
.bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(var(--bg),transparent);z-index:5}
.bar h1{font-family:var(--disp);font-weight:600;font-size:22px;margin:0 12px 0 0;letter-spacing:.01em}
.bar button{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.bar button:hover,.bar button:focus-visible{border-color:var(--accent);outline:none}
.bar .hint{font-size:12px;color:var(--muted)}
#panel{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:72px;width:min(380px,calc(100vw - 32px));max-height:calc(100% - 96px);overflow:auto;background:color-mix(in srgb,var(--card) 94%,transparent);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;z-index:6;box-shadow:0 20px 50px rgba(0,0,0,.45)}
#panel .tag{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
#panel h2{font-family:var(--disp);font-weight:600;font-size:24px;margin:0 0 8px;text-wrap:balance}
#panel p{font-size:14px;line-height:1.5;color:var(--muted);margin:0 0 10px}
#panel .kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
#panel .k{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
#panel .k b{display:block;font-family:var(--disp);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
#panel .k span{font-size:11px;color:var(--muted)}
#panel .k.bad b{color:var(--bad)} #panel .k.ok b{color:var(--ok)}
#panel .act{border-left:3px solid var(--accent);padding:6px 10px;font-size:14px;color:var(--ink);background:rgba(224,164,88,.08);border-radius:0 8px 8px 0}
#panel .close{float:right;background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer}
.pin{position:fixed;transform:translate(-50%,-100%);z-index:4;font-size:12px;font-weight:600;color:var(--bg);background:var(--accent);border-radius:999px;padding:3px 9px;white-space:nowrap;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.4);user-select:none}
.pin::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-top-color:var(--accent);border-bottom:0}
.pin.on{background:var(--ink)} .pin.on::after{border-top-color:var(--ink)}
#cap{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(0,0,0,.55);padding:8px 16px;border-radius:999px;font-size:14px;z-index:5;max-width:calc(100vw - 32px);text-align:center}
#pad{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:none;grid-template-columns:repeat(3,44px);gap:6px;z-index:5}
#pad button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px}
@media (max-width:700px){#panel{top:auto;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-height:45%}.bar .hint{display:none}#pad{display:grid}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const TOUR = ['door','menu','cash','pastry','machine','pickup','tables','books'];

const W = () => innerWidth, H = () => innerHeight;
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(W(),H());
renderer.shadowMap.enabled = true; renderer.outputEncoding = THREE.sRGBEncoding;
document.getElementById('scene').appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1b1410); scene.fog = new THREE.Fog(0x1b1410, 14, 30);
const cam = new THREE.PerspectiveCamera(60, W()/H(), 0.1, 100);

const M = (c, r=0.8, m=0) => new THREE.MeshStandardMaterial({color:c, roughness:r, metalness:m});
const box = (w,h,d,mat,x,y,z,parent=scene) => { const g = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); g.position.set(x,y,z); g.castShadow = g.receiveShadow = true; parent.add(g); return g; };

const panel = document.getElementById('panel'), cap = document.getElementById('cap');
function showCard(s){
  panel.replaceChildren();

// камера: положение + углы
const pos = new THREE.Vector3(0,9,13); let yaw = 0, pitch = -0.62;
let anim = null;
function lookAngles(from, to){ const d = new THREE.Vector3().subVectors(to, from); return {yaw: Math.atan2(-d.x, -d.z), pitch: Math.atan2(d.y, Math.hypot(d.x, d.z))}; }
function flyTo(p, l, ms=1600){ const a = lookAngles(new THREE.Vector3(...p), new THREE.Vector3(...l));
  let dy = a.yaw - yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
  anim = {t0: performance.now(), ms: matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : ms, p0: pos.clone(), p1: new THREE.Vector3(...p), y0: yaw, y1: yaw+dy, pi0: pitch, pi1: a.pitch}; }
function focusSpot(id){ const s = SPOTS.find(x=>x.id===id); stopTour(); flyTo(s.cam, s.look); showCard(s); cap.textContent = s.tag; }

let tourIdx = -1, tourTimer = null;
const tourBtn = document.getElementById('tour');
function stopTour(){ clearTimeout(tourTimer); tourIdx = -1; tourBtn.textContent = '▶ Экскурсия по процессу'; }
function tourStep(){ tourIdx++; if (tourIdx >= TOUR.length){ stopTour(); cap.textContent = 'Экскурсия завершена: путь гостя пройден от входа до повторного визита'; return; }
  const s = SPOTS.find(x=>x.id===TOUR[tourIdx]); flyTo(s.cam, s.look, 2200); showCard(s); cap.textContent = `${tourIdx+1}/${TOUR.length} · ${s.tag}`; tourTimer = setTimeout(tourStep, 7000); }
tourBtn.onclick = () => { if (tourIdx >= 0){ stopTour(); return; } tourBtn.textContent = '■ Остановить'; tourStep(); };
document.getElementById('reset').onclick = () => { stopTour(); panel.hidden = true; flyTo([0,9,13],[0,0,-1]); cap.textContent = 'Вид сверху: бар у дальней стены, зал у окна, полка с книгами слева'; };
panel.hidden = true;

// управление
const keys = {};
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (['arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase())) e.preventDefault(); });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
document.querySelectorAll('#pad button').forEach(b => { const k = b.dataset.k; b.addEventListener('pointerdown', () => keys[k] = true); ['pointerup','pointerleave'].forEach(ev => b.addEventListener(ev, () => keys[k] = false)); });
let drag = null;
renderer.domElement.addEventListener('pointerdown', e => { drag = {x:e.clientX, y:e.clientY, moved:false}; });
addEventListener('pointerup', e => { if (drag && !drag.moved) pick(e); drag = null; });
addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX-drag.x, dy = e.clientY-drag.y; if (Math.abs(dx)+Math.abs(dy) > 3) drag.moved = true;
  yaw -= dx*.004; pitch = Math.max(-1.3, Math.min(1.1, pitch - dy*.004)); drag.x = e.clientX; drag.y = e.clientY; anim = null; });
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(e){ ndc.set(e.clientX/W()*2-1, -(e.clientY/H())*2+1); ray.setFromCamera(ndc, cam); const hit = ray.intersectObjects(scene.children)[0]; if (!hit) return;
  let best = null, bd = 1.6; SPOTS.forEach(s => { const d = hit.point.distanceTo(new THREE.Vector3(...s.pos)); if (d < bd + 1.2){ bd = d; best = s; } }); if (best) focusSpot(best.id); }

addEventListener('resize', () => { renderer.setSize(W(),H()); cam.aspect = W()/H(); cam.updateProjectionMatrix(); });
const clock = new THREE.Clock(); const tmp = new THREE.Vector3();
function frame(){
  const dt = Math.min(clock.getDelta(), .05);
  if (anim){ const k = Math.min(1, (performance.now()-anim.t0)/anim.ms), e = k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
    pos.lerpVectors(anim.p0, anim.p1, e); yaw = anim.y0 + (anim.y1-anim.y0)*e; pitch = anim.pi0 + (anim.pi1-anim.pi0)*e; if (k >= 1) anim = null; }
  const f = (keys.w||keys.arrowup?1:0) - (keys.s||keys.arrowdown?1:0), r = (keys.d||keys.arrowright?1:0) - (keys.a||keys.arrowleft?1:0);
  if (f||r){ anim = null; if (tourIdx >= 0) stopTour(); const sp = 3*dt; pos.x += (-Math.sin(yaw)*f + Math.cos(yaw)*r)*sp; pos.z += (-Math.cos(yaw)*f - Math.sin(yaw)*r)*sp;
    pos.y += (1.7 - pos.y) * Math.min(1, dt*3); pos.x = Math.max(-4.6, Math.min(4.6, pos.x)); pos.z = Math.max(-1.6, Math.min(14, pos.z)); }
  cam.position.copy(pos); cam.rotation.set(0,0,0); cam.rotateY(yaw); cam.rotateX(pitch);
  renderer.render(scene, cam);
  pins.forEach(p => { tmp.copy(p.v).project(cam); const vis = tmp.z < 1 && Math.abs(tmp.x) < 1.1 && Math.abs(tmp.y) < 1.1; p.el.hidden = !vis;
    if (vis){ p.el.style.left = ((tmp.x+1)/2*W()) + 'px'; p.el.style.top = ((1-tmp.y)/2*H()) + 'px'; } });
  requestAnimationFrame(frame);
}
cam.position.copy(pos); flyTo([0,9,13],[0,0,-1],1); frame();
</script>
