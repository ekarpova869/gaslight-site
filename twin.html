<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}</style>
<title>Газлайт: цифровой двойник</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: сцена на весь экран; слева процесс (BPMN) и путь гостя (CJM), справа KPI, склад и экономика, снизу лента данных */
:root{--bg:#17110d;--ink:#f3e9dc;--muted:#bba994;--card:rgba(36,27,21,.9);--line:#4a3a2e;--accent:#e0a458;--ok:#8fc78a;--warn:#e9c46a;--bad:#e4705a;--disp:"Playfair Display",Georgia,serif;--body:"Inter Tight","Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",Consolas,monospace;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;font-size:13px}
#scene{position:fixed;inset:0}
canvas{display:block}
.top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:6;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(var(--bg) 60%,transparent)}
.top h1{font-family:var(--disp);font-weight:600;font-size:20px;margin:0 6px 0 0}
#clock{font-family:var(--mono);font-size:22px;color:var(--accent);min-width:64px;font-variant-numeric:tabular-nums}
.btn,.seg button{font:inherit;color:var(--ink);background:#2a201a;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.btn:hover,.seg button:hover,.btn:focus-visible{border-color:var(--accent);outline:none}
.btn.primary{background:var(--accent);color:#1b1410;border-color:var(--accent);font-weight:600}
.seg{display:inline-flex;gap:0}.seg button{border-radius:0;padding:6px 10px}.seg button:first-child{border-radius:999px 0 0 999px}.seg button:last-child{border-radius:0 999px 999px 0}
.seg button.on{background:var(--ink);color:#1b1410}
.sc{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1px dashed var(--line);border-radius:999px;cursor:pointer;user-select:none}
.sc input{accent-color:var(--accent)}
.panel{position:fixed;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;backdrop-filter:blur(4px);max-height:calc(100% - 210px);overflow:auto}
#left{left:max(16px,env(safe-area-inset-left,0px));top:96px;width:250px}
#right{right:max(16px,env(safe-area-inset-right,0px));top:96px;width:270px}
.panel h3{margin:4px 0 6px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:600}
.row{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.row b{font-variant-numeric:tabular-nums}
.row .id{font-family:var(--mono);color:var(--muted);font-size:11px;min-width:54px}
.row span.t{flex:1}
.cjm{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:4px}
.cjm div{border-radius:6px;padding:5px 2px;text-align:center;font-size:11px;background:#2a201a;border-top:4px solid var(--muted)}
.cjm small{display:block;color:var(--muted);font-size:9px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kp div{background:#1f1712;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.kp b{display:block;font-family:var(--disp);font-size:18px;font-variant-numeric:tabular-nums}
.kp span{font-size:10px;color:var(--muted)}
.good{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
canvas.mini{width:100%;height:70px;margin-top:4px}
#feed{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(760px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-family:var(--mono);font-size:11.5px;line-height:1.55}
#feed .hd{display:flex;justify-content:space-between;align-items:center;font-family:var(--body);margin-bottom:2px}
#feed .hd h3{margin:0;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
#feed .ln{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src{display:inline-block;min-width:96px;color:var(--accent)}
.bub{position:fixed;z-index:4;transform:translate(-50%,-100%);background:#f3e9dc;color:#1b1410;border-radius:10px;padding:3px 8px;font-size:11px;font-weight:600;white-space:nowrap;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.bub.bad{background:var(--bad);color:#fff}
.modal{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:#21180f;border:1px solid var(--line);border-radius:14px;max-width:760px;width:100%;max-height:90%;overflow:auto;padding:18px 20px}
.modal h2{font-family:var(--disp);font-weight:600;margin:0 0 6px;font-size:24px}
.modal p{color:var(--muted);line-height:1.5}
.modal table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin:8px 0}
.modal td,.modal th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right}.modal td:first-child,.modal th:first-child{text-align:left}
.modal th{color:var(--muted);font-weight:600;font-size:12px}
.modal pre{font-family:var(--mono);font-size:11px;white-space:pre-wrap;background:#140e0a;padding:10px;border-radius:8px;max-height:50vh;overflow:auto}
#guest{position:fixed;z-index:7;left:50%;top:96px;transform:translateX(-50%);width:min(360px,calc(100vw - 32px));background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:10px 12px}
#guest .x{float:right;background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:11px;color:var(--muted);margin-top:4px}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.tog{display:none}
@media (max-width:980px){#left,#right{display:none}#left.show,#right.show{display:block;top:auto;bottom:150px;max-height:45%}.tog{display:inline-block}#feed{font-size:10.5px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="scene"></div>
<div class="top">
  <h1>Газлайт · цифровой двойник</h1>
  <span id="clock">07:55</span>
  <button class="btn primary" id="play" type="button">▶ Старт</button>
  <span class="seg" id="speed" aria-label="Скорость"><button data-v="2" type="button">×2</button><button data-v="6" class="on" type="button">×6</button><button data-v="20" type="button">×20</button></span>
  <span class="seg" id="daytype" aria-label="Тип дня"><button data-v="weekday" class="on" type="button">Будний</button><button data-v="weekend" type="button">Выходной</button></span>
  <label class="sc"><input type="checkbox" id="scMorning">2-й бариста 8:00–10:30</label>
  <label class="sc"><input type="checkbox" id="scPastry">+6 выпечки, поставка 14:00</label>
  <label class="sc"><input type="checkbox" id="scLate">Вых.: смена до 18:00</label>
  <button class="btn" id="restart" type="button">↺ Заново</button>
  <button class="btn" id="results" type="button">Итоги дня</button>
  <button class="btn tog" data-p="left" type="button">Процесс</button>
  <button class="btn tog" data-p="right" type="button">KPI</button>
</div>

<aside class="panel" id="left">
  <h3>Процесс BPMN · сейчас / за день</h3>
  <div id="bpmn"></div>
  <h3 style="margin-top:10px">Путь гостя CJM · эмоция</h3>
  <div class="cjm" id="cjm"></div>
  <div class="legend"><span><i style="background:var(--ok)"></i>доволен</span><span><i style="background:var(--warn)"></i>раздражён</span><span><i style="background:var(--bad)"></i>недоволен</span></div>
  <h3 style="margin-top:10px">Сегменты RFM (кольцо над гостем)</h3>
  <div class="legend" id="seglegend"></div>
</aside>

<aside class="panel" id="right">
  <h3>KPI дня</h3>
  <div class="kp" id="kpi"></div>
  <h3 style="margin-top:10px">Заказы и SLA по часам</h3>
  <canvas class="mini" id="chart" width="520" height="140"></canvas>
  <h3 style="margin-top:8px">Склад · выпечка</h3>
  <div id="stock"></div>
  <canvas class="mini" id="stockChart" width="520" height="100" style="height:50px"></canvas>
  <h3 style="margin-top:8px">Экономика дня</h3>
  <div id="eco"></div>
</aside>

<section id="feed" aria-live="off">
  <div class="hd"><h3>Данные рождаются на каждом шаге · источник</h3><button class="btn" id="logbtn" type="button" style="padding:3px 10px">Журнал дня</button></div>
  <div id="lines"></div>
</section>
<div id="guest" hidden></div>
<div class="modal" id="modal" hidden><div class="box" id="mbox"></div></div>

<script src="vendor/three.min.js"></script>
<script>// Движок «цифрового двойника» кофейни Газлайт. Время — минуты от 0:00.
// Параметры откалиброваны по учебному набору (01.04–25.10.2026).
(function (root) {
  function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const HOUR_WD = [11, 13, 8, 6, 7, 9, 8, 6, 6, 6, 5, 4, 3, 2], HOUR_WE = [3, 6, 10, 12, 12, 11, 10, 9, 8, 7, 5, 4, 3, 2];
  const SEGMENTS = [['Чемпионы', .355], ['Лояльные', .208], ['Под угрозой ухода', .084], ['Новички', .081], ['Нуждаются во внимании', .064], ['Спящие', .208]];
  const P = {
    openMin: 8 * 60, closeMin: 22 * 60,
    ordersPerDay: { weekday: 98, weekend: 122 },
    pastryStock: { weekday: 12, weekend: 11 }, pastryProb: { weekday: .095, weekend: .115 },
    extraPastry: 6, secondDeliveryAt: 14 * 60, pastryCost: 80, pastryPrice: 230,
    checkTakeaway: 413, checkDineIn: 553, cogsShare: .226, wagePerHour: 350,
    churnUplift: .07, futureValue: 1920, seats: 8, balkQueue: 5, balkProb: .5, payFail: .008, replaceAccept: .55, identified: .47, sla: 5,
  };
  function baristasAt(min, dayType, sc) {
    let n = 1;
    if (dayType === 'weekend' && min >= 600 && min < (sc.weekendLate ? 1080 : 960)) n = 2;
    if (dayType === 'weekday' && sc.morningBarista && min >= 480 && min < 630) n = 2;
    return n;
  }
  function staffHours(dayType, sc) { // кассир 14 ч + бариста 14 ч + доп. смены
    let h = 28;
    if (dayType === 'weekend') h += sc.weekendLate ? 8 : 6;
    if (dayType === 'weekday' && sc.morningBarista) h += 2.5;
    return h;
  }

  function createDay(opts) {
    const dayType = opts.dayType || 'weekday', sc = Object.assign({ morningBarista: false, morePastry: false, weekendLate: false }, opts.scenario || {});
    const R = rng(opts.seed || 1);
    const w = dayType === 'weekend' ? HOUR_WE : HOUR_WD, ws = w.reduce((a, b) => a + b, 0);
    // приходы гостей (Пуассон по часам)
    const arrivals = [];
    w.forEach((wh, i) => { const lam = P.ordersPerDay[dayType] * 1.04 * wh / ws; let k = 0, p = Math.exp(-lam), s = p, u = R(); while (u > s) { k++; p *= lam / k; s += p; }
      for (let j = 0; j < k; j++) { let m = R() * 60; if (dayType === 'weekday' && i <= 1) m = i === 0 ? 15 + R() * 45 : R() * 55; arrivals.push(P.openMin + i * 60 + m); } });
    arrivals.sort((a, b) => a - b);
    let gid = 0;
    const guests = arrivals.map((t) => {
      const h = Math.floor(t / 60), morningWd = dayType === 'weekday' && h < 11;
      const ident = R() < P.identified;
      let seg = null; if (ident) { let u = R(), c = 0; for (const [n, p] of SEGMENTS) { c += p; if (u <= c) { seg = n; break; } } seg = seg || 'Спящие'; }
      const dineP = (morningWd ? .25 : dayType === 'weekend' ? .55 : .42);
      const dine = R() < dineP;
      const items = 1 + (R() < (dine ? .6 : .3) ? 1 : 0) + (R() < (dine ? .2 : .05) ? 1 : 0);
      const wantsPastry = R() < P.pastryProb[dayType] * (dine ? 1.3 : .8) * 1.1;
      let prep = 0; for (let i = 0; i < items; i++) { const u = R(); prep += i === 0 ? 1.8 + R() * 1.0 : u < .45 ? .6 + R() * .7 : u < .85 ? 1.9 + R() * 1.1 : 3 + R() * 2; }
      const check = (dine ? P.checkDineIn : P.checkTakeaway) * (.8 + R() * .4) + (wantsPastry ? P.pastryPrice : 0);
      return { id: ++gid, order: 100000 + gid, t, dine, items, wantsPastry, prep, check: Math.round(check), seg, ident,
        phase: 'outside', mood: 1, events: [], seatTime: 15 + R() * 30, rnd: R() };
    });
    const st = {
      dayType, sc, t: P.openMin - 5, guests, queue: [], cashier: null, cashierFreeAt: 0, kitchen: [], baristas: [],
      waiting: [], seated: [], stock: P.pastryStock[dayType], stockLog: [], delivered2: false,
      log: [], counters: { arrived: 0, registered: 0, paid: 0, ready: 0, issued: 0, lostBalk: 0, lostStock: 0, lostPay: 0, noSeat: 0, replaced: 0 },
      revenue: 0, waits: [], hourly: Array.from({ length: 14 }, () => ({ orders: 0, inSla: 0, withWait: 0, revenue: 0 })),
      writeOff: 0, done: false, R,
    };
    st.stockLog.push([st.t, st.stock]);
    return st;
  }
  const hhmm = (m) => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(Math.floor(m % 60)).padStart(2, '0');
  function ev(st, g, step, source, text) { const r = { t: st.t, order: g ? g.order : null, step, source, text }; st.log.push(r); if (g) g.events.push(r); return r; }

  function step(st, dt) {
    if (st.done) return;
    const end = st.t + dt;
    while (st.t < end && !st.done) {
      const tick = Math.min(.25, end - st.t); st.t += tick; const t = st.t; const R = st.R;
      // поставки
      if (st.sc.morePastry && !st.delivered2 && t >= P.secondDeliveryAt) { st.delivered2 = true; st.stock += P.extraPastry; ev(st, null, 'Склад', 'Склад', `Вторая поставка выпечки: +${P.extraPastry} шт.`); st.stockLog.push([t, st.stock]); }
      // приходы
      for (const g of st.guests) {
        if (g.phase !== 'outside' || g.t > t) continue;
        st.counters.arrived++;
        if (st.queue.length >= P.balkQueue && R() < P.balkProb) { g.phase = 'left'; g.mood = 0; g.lost = 'очередь'; st.counters.lostBalk++; ev(st, g, 'C2', 'Хронометраж', 'Увидел очередь и ушёл без заказа'); continue; }
        g.phase = 'queue'; g.qAt = t; st.queue.push(g); ev(st, g, 'C1→C2', 'Хронометраж', 'Пришёл, встал в очередь');
      }
      // касса: T01 → G01 → (T02) → T03/G03
      if (st.cashier && t >= st.cashierFreeAt) {
        const g = st.cashier; st.cashier = null;
        if (g.payFailed) { g.phase = 'left'; g.mood = 0; g.lost = 'оплата'; st.counters.lostPay++; ev(st, g, 'T07', 'Эквайринг', 'Оплата не прошла, заказ отменён'); }
        else if (g.cancelStock) { g.phase = 'left'; g.mood = 0; g.lost = 'выпечка'; st.counters.lostStock++; ev(st, g, 'T07', 'Касса', 'Нет выпечки, замену не принял — отмена'); }
        else {
          g.paidAt = t; st.counters.paid++; st.revenue += 0; g.phase = 'waitPrep'; st.kitchen.push(g); st.waiting.push(g);
          ev(st, g, 'T03', 'Эквайринг', `Оплата ${g.check} ₽ прошла`);
        }
      }
      if (!st.cashier && st.queue.length) {
        const g = st.queue.shift(); st.cashier = g; g.phase = 'order'; st.counters.registered++;
        const qWait = t - g.qAt; if (qWait > 4) g.mood = Math.min(g.mood, .5);
        ev(st, g, 'T01', 'Касса', `Заказ #${g.order}: ${g.items} поз., ${g.dine ? 'в зале' : 'с собой'}${g.seg ? ', карта: ' + g.seg : ''}`);
        let dur = 1.1 + R() * 1.0;
        if (g.wantsPastry) {
          if (st.stock > 0) { st.stock--; st.stockLog.push([t, st.stock]); ev(st, g, 'G01', 'Склад', `Выпечка есть, осталось ${st.stock} шт.`); }
          else { dur += .5; g.mood = Math.min(g.mood, .5); ev(st, g, 'T02', 'Касса', 'Выпечки нет — предложили замену');
            if (R() < P.replaceAccept) { st.counters.replaced++; g.check -= P.pastryPrice - 150; } else { g.cancelStock = true; } }
        }
        if (!g.cancelStock && R() < P.payFail) g.payFailed = true;
        st.cashierFreeAt = t + dur;
      }
      // бар: T04 → T05
      const nb = baristasAt(t, st.dayType, st.sc);
      while (st.baristas.length < nb) st.baristas.push({ freeAt: t, cur: null });
      st.baristas.forEach((b, i) => {
        if (b.cur && t >= b.freeAt) { const g = b.cur; b.cur = null; g.readyAt = t; g.phase = 'pickup'; st.counters.ready++;
          const wait = g.readyAt - g.paidAt; st.waits.push(wait); const hi = Math.min(13, Math.floor(g.paidAt / 60) - 8); const hr = st.hourly[hi]; hr.withWait++; if (wait <= P.sla) hr.inSla++;
          if (wait > 8) g.mood = Math.min(g.mood, .2); else if (wait > P.sla) g.mood = Math.min(g.mood, .55);
          ev(st, g, 'T05', 'Экран заказов', `Готово через ${wait.toFixed(1)} мин`); g.issueAt = t + .3 + R() * .6; }
        if (!b.cur && i < nb && st.kitchen.length) { const g = st.kitchen.shift(); b.cur = g; g.phase = 'prep'; g.prepStart = t; b.freeAt = t + g.prep; ev(st, g, 'T04', 'Экран заказов', `Бариста ${i + 1} готовит`); }
      });
      if (st.baristas.length > nb) st.baristas = st.baristas.filter((b, i) => i < nb || b.cur);
      // выдача T06, зал C5, уход C6
      for (const g of st.waiting) {
        if (g.phase === 'pickup' && t >= g.issueAt) {
          g.phase = 'issued'; st.counters.issued++; st.revenue += g.check; const hi = Math.min(13, Math.floor(g.t / 60) - 8); st.hourly[hi].orders++; st.hourly[hi].revenue += g.check;
          ev(st, g, 'T06', 'Экран заказов', `Выдан, ${g.check} ₽`);
          if (g.dine) { if (st.seated.length < P.seats) { g.phase = 'seated'; g.leaveAt = t + g.seatTime; st.seated.push(g); ev(st, g, 'C5', 'Касса', 'Сел за стол'); }
            else { g.phase = 'left'; g.mood = Math.min(g.mood, .4); st.counters.noSeat++; ev(st, g, 'C5', 'Опрос', 'Нет свободных мест — ушёл с заказом'); g.done = true; } }
          else { g.phase = 'left'; g.done = true; }
          if (g.phase === 'left') ev(st, g, 'C6', 'Опрос', g.mood >= .8 ? 'Доволен: оценка 5' : g.mood >= .5 ? 'Оценка 4' : 'Недоволен: оценка 2');
        }
        if (g.phase === 'seated' && t >= g.leaveAt) { g.phase = 'left'; g.done = true; st.seated = st.seated.filter((x) => x !== g); ev(st, g, 'C6', 'Опрос', g.mood >= .8 ? 'Доволен: оценка 5' : g.mood >= .5 ? 'Оценка 4' : 'Недоволен: оценка 2'); }
      }
      st.waiting = st.waiting.filter((g) => !g.done);
      if (t >= P.closeMin && !st.queue.length && !st.cashier && !st.kitchen.length && st.baristas.every((b) => !b.cur) && !st.waiting.some((g) => g.phase !== 'seated')) {
        st.writeOff = st.stock; if (st.stock > 0) ev(st, null, 'Склад', 'Склад', `Закрытие: списано ${st.stock} шт. выпечки`);
        st.done = true;
      }
    }
  }
  function summary(st) {
    const w = st.waits.slice().sort((a, b) => a - b), med = w.length ? w[Math.floor(w.length / 2)] : 0;
    const c = st.counters, lost = c.lostBalk + c.lostStock + c.lostPay;
    const issued = st.guests.filter((g) => g.phase === 'issued' || g.phase === 'seated' || (g.phase === 'left' && !g.lost));
    const happy = issued.filter((g) => g.mood >= .5).length, unhappy = issued.length - happy + lost + c.noSeat;
    const churnRisk = unhappy * P.churnUplift * P.futureValue;

  const base = T.runDay({seed, dayType, scenario:{}}), cur = T.runDay({seed, dayType, scenario: scenario()});
  const isBase = !scMorning.checked && !scPastry.checked && !scLate.checked;
  const rows = [['Заказов выдано', 'orders', v => RU.format(v)], ['Потеряно гостей (очередь, выпечка, оплата)', 'lost', v => RU.format(v)], ['Готово за 5 мин', 'sla', pct], ['Медиана ожидания, мин', 'median', v => v.toFixed(1)], ['P90 ожидания, мин', 'p90', v => v.toFixed(1)], ['Довольных гостей', 'csat', pct], ['Выручка', 'revenue', money], ['Списано выпечки, шт.', 'writeOff', v => RU.format(v)], ['ФОТ', 'labor', money], ['Результат дня', 'result', money], ['Будущая выручка под риском (оценка)', 'churnRisk', money], ['Результат с учётом удержания', 'resultWithChurn', money]];
  const b = document.getElementById('mbox');
  b.innerHTML = `<h2>Итоги дня: ${dayType === 'weekday' ? 'будний' : 'выходной'} день</h2><p>Тот же поток гостей (seed ${seed}), прогнанный дважды: без изменений и с выбранными сценариями. Ставка ФОТ 350 ₽/ч, себестоимость выпечки 80 ₽ — учебные допущения. «Под риском»: недовольный гость на 7 п.п. реже возвращается (опрос: 78 % против 85 %), ценность гостя за месяц — 4 визита × 480 ₽.</p>`;
  const t = document.createElement('table'); t.innerHTML = `<tr><th>Показатель</th><th>База</th><th>${isBase ? 'Сценарии не выбраны' : 'Сценарий'}</th><th>Δ</th></tr>` +
    rows.map(([n,k,f]) => { const d = cur[k] - base[k]; const good = ['lost','median','p90','writeOff','labor','churnRisk'].includes(k) ? d < 0 : d > 0;
      return `<tr><td>${n}</td><td>${f(base[k])}</td><td>${f(cur[k])}</td><td class="${Math.abs(d) < 1e-6 ? '' : good ? 'good' : 'bad'}">${Math.abs(d) < 1e-6 ? '—' : (d > 0 ? '+' : '') + (k === 'sla' || k === 'csat' ? (d*100).toFixed(0) + ' п.п.' : f(d).replace(' ₽',' ₽'))}</td></tr>`; }).join('');
  b.appendChild(t);
  const p = document.createElement('p'); p.innerHTML = 'По 30 смоделированным дням: второй бариста в будни 8:00–10:30 даёт +594 ₽/день с учётом удержания (SLA 59 % → 72 %); дополнительная выпечка окупается только в выходные (+1 297 ₽/день); продление смены в выходные до 18:00 не окупается (−179 ₽/день).'; b.appendChild(p);
  const close = document.createElement('button'); close.className = 'btn primary'; close.textContent = 'Закрыть'; close.onclick = () => modal.hidden = true; b.appendChild(close);
  modal.hidden = false;
}
const modal = document.getElementById('modal'); modal.addEventListener('click', e => { if (e.target === modal) modal.hidden = true; });
document.getElementById('logbtn').onclick = () => {
  const csv = 'time;order;step;source;text\n' + st.log.map(e => [T.hhmm(e.t), e.order ?? '', e.step, e.source, '"' + e.text.replace(/"/g,'""') + '"'].join(';')).join('\n');
  const b = document.getElementById('mbox'); b.innerHTML = `<h2>Журнал дня — сырые данные</h2><p>${st.log.length} событий. Это тот же формат, что приходит из кассы, эквайринга, экрана заказов и склада; дальше его очищает ETL (этап 3).</p>`;
  const pre = document.createElement('pre'); pre.textContent = csv.split('\n').slice(0, 400).join('\n'); const cp = document.createElement('button'); cp.className = 'btn primary'; cp.textContent = 'Скопировать CSV';
  cp.onclick = () => navigator.clipboard.writeText(csv).then(() => cp.textContent = 'Скопировано', () => { const r = document.createRange(); r.selectNodeContents(pre); getSelection().removeAllRanges(); getSelection().addRange(r); cp.textContent = 'Выделено — Ctrl+C'; });
  const close = document.createElement('button'); close.className = 'btn'; close.textContent = 'Закрыть'; close.style.marginLeft = '8px'; close.onclick = () => modal.hidden = true;
  b.append(pre, cp, close); modal.hidden = false; };

// ---------- камера ----------
let yaw = 0, pitch = -.72, radius = 15.5, tgt = new THREE.Vector3(0,0,1.2), drag = null;
renderer.domElement.addEventListener('pointerdown', e => drag = {x:e.clientX, y:e.clientY});
addEventListener('pointerup', () => drag = null);
addEventListener('pointermove', e => { if (!drag) return; yaw -= (e.clientX - drag.x)*.005; pitch = Math.max(-1.35, Math.min(-.2, pitch - (e.clientY - drag.y)*.004)); drag = {x:e.clientX, y:e.clientY}; });
renderer.domElement.addEventListener('wheel', e => { radius = Math.max(6, Math.min(24, radius + e.deltaY*.01)); e.preventDefault(); }, {passive:false});
addEventListener('resize', () => { renderer.setSize(W(),H()); cam.aspect = W()/H(); cam.updateProjectionMatrix(); });

// ---------- цикл ----------
const clk = new THREE.Clock(), tmp = new THREE.Vector3(); let acc = 0;
function frame(){
  const dt = Math.min(clk.getDelta(), .1);
  if (running && !st.done){ const dSim = dt * speed; T.step(st, dSim); syncAgents(); moveAgents(dSim); pushLog();
    // курьер: поставка утром и в 14:00
    if (st.t < P.openMin + 4 || (st.sc.morePastry && st.t >= P.secondDeliveryAt && st.t < P.secondDeliveryAt + 5)){ staff.courier.visible = true; const k = ((st.t % 5) / 5); staff.courier.position.set(1.6, 0, OUT[1] - (OUT[1] + 1.2) * Math.sin(k*Math.PI)); } else staff.courier.visible = false;
    acc += dt; if (acc > .2){ acc = 0; draw(); if (selected) showGuest(selected); }
    if (st.done){ running = false; playBtn.textContent = '▶ Новый день'; draw(); showResults(); } }
  else if (running) moveAgents(dt * speed);
  cam.position.set(tgt.x + radius*Math.cos(pitch)*Math.sin(yaw), tgt.y - radius*Math.sin(pitch), tgt.z + radius*Math.cos(pitch)*Math.cos(yaw)); cam.lookAt(tgt);
  renderer.render(scene, cam);
  bubbles = bubbles.filter(b => { b.ttl -= dt; const a = agents.get(b.gid); if (b.ttl <= 0 || !a){ b.el.remove(); return false; }
    tmp.set(a.obj.position.x, 1.75, a.obj.position.z).project(cam); b.el.style.left = ((tmp.x+1)/2*W()) + 'px'; b.el.style.top = ((1-tmp.y)/2*H()) + 'px'; return true; });
  requestAnimationFrame(frame);
}
reset(); frame();
</script>
